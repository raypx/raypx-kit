name: Release

on:
  push:
    branches: [canary]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Verify toolchain
        run: bun scripts/ci/diagnostics.ts run toolchain bun run verify:toolchain
      - uses: changesets/action/select-mode@v2.0.0
        id: mode
        env:
          # npm is only the registry transport; repository tooling stays on Bun.
          # Its devEngines check otherwise rejects the strict Bun runtime pin.
          NPM_CONFIG_FORCE: "true"
      - name: Explain pending version PR setup
        if: steps.mode.outputs.mode == 'version' && vars.VERSION_PR_ENABLED != 'true'
        run: |
          echo '::notice::Version PR automation is disabled. Enable Actions pull-request creation in repository settings, then set VERSION_PR_ENABLED=true.'
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Version changes are pending. Automatic version PR creation is disabled.

          Enable **Allow GitHub Actions to create and approve pull requests** under
          **Settings → Actions → General → Workflow permissions**, then set the
          repository Actions variable `VERSION_PR_ENABLED` to `true`.
          Run this workflow again to create the version PR. Package publishing is
          configured separately through `NPM_PUBLISH_ENABLED`.
          SUMMARY
      - name: Report release planning diagnostics
        if: always()
        uses: ./.github/actions/report-diagnostics
        with:
          job-status: ${{ job.status }}
          artifact-name: release-plan-diagnostics

  version:
    needs: plan
    if: needs.plan.outputs.mode == 'version' && vars.VERSION_PR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Verify toolchain
        run: bun scripts/ci/diagnostics.ts run toolchain bun run verify:toolchain
      - uses: changesets/action/version@v2.0.0
        with:
          script: bun scripts/ci/diagnostics.ts run version-packages bun run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      - name: Report version preparation diagnostics
        if: always()
        uses: ./.github/actions/report-diagnostics
        with:
          job-status: ${{ job.status }}
          artifact-name: release-version-diagnostics

  compatibility:
    needs: plan
    if: needs.plan.outputs.mode == 'publish' && vars.NPM_PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/node-compatibility.yml

  publish:
    needs: [plan, compatibility]
    # Initial repository pushes never publish or fail for missing npm setup.
    # Enable only after configuring npm scope access and CI authentication.
    if: needs.plan.outputs.mode == 'publish' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up repository toolchain
        uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-node-tools
        with:
          registry-url: https://registry.npmjs.org/
      - uses: ./.github/actions/vp-restore
        id: cache
      - name: Verify development toolchain
        run: bun scripts/ci/diagnostics.ts run toolchain bun run verify:toolchain
      - name: Verify source before publication
        run: bun scripts/ci/diagnostics.ts run source bun run verify:source
      - name: Test and build before publication
        run: bun scripts/ci/diagnostics.ts run tests-build bun run verify:tests
      - name: Verify package and release artifacts
        run: bun scripts/ci/diagnostics.ts run artifacts bun run verify:artifacts
      - uses: ./.github/actions/vp-save
        with:
          key: ${{ steps.cache.outputs.key }}
      - uses: changesets/action/publish@v2.0.0
        with:
          # Bun packs the archives so workspace: and catalog: dependencies resolve;
          # plain changeset publish would pack this Bun workspace with npm.
          # The action runs the script without a shell, so `&&` lives in package.json.
          script: bun scripts/ci/diagnostics.ts run publish bun run release:ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # Limit the npm transport override to this publication step.
          NPM_CONFIG_FORCE: "true"
      - name: Report publication diagnostics
        if: always()
        uses: ./.github/actions/report-diagnostics
        with:
          job-status: ${{ job.status }}
          artifact-name: release-publish-diagnostics
