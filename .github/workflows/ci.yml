name: CI
on:
  pull_request:
  push:
    branches: [canary]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a canary workflow after it enters publication.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/canary' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      browser: ${{ steps.plan.outputs.browser }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
      postgres: ${{ steps.plan.outputs.postgres }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Planning imports only Bun/standard-library modules; no dependency install needed.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - id: plan
        run: bun scripts/ci/plan.ts
  javascript:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/vp-restore
        id: cache
      - name: Verify affected sources, tests and builds
        run: bun scripts/ci/diagnostics.ts run javascript bun scripts/ci/gate.ts javascript
      - name: Generated sources remain reproducible
        run: git diff --exit-code
      - uses: ./.github/actions/vp-save
        with:
          key: ${{ steps.cache.outputs.key }}
      - uses: ./.github/actions/report-diagnostics
        if: always()
        with:
          job-status: ${{ job.status }}
          artifact-name: javascript-diagnostics
  browser:
    needs: [plan, javascript]
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/vp-restore
        id: cache
      - name: Resolve Playwright version
        id: playwright
        run: printf 'version=%s\n' "$(bun --bun playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Install missing browser and system libraries
        run: bun scripts/ci/diagnostics.ts run browser-install bash scripts/ci/browser.sh
      - name: Test affected React workspaces
        run: bun scripts/ci/diagnostics.ts run browser bun scripts/ci/gate.ts browser
      - uses: ./.github/actions/vp-save
        with:
          key: ${{ steps.cache.outputs.key }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: .artifacts/e2e/
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: ./.github/actions/report-diagnostics
        if: always()
        with:
          job-status: ${{ job.status }}
          artifact-name: browser-diagnostics
  artifacts:
    needs: [plan, javascript]
    if: needs.plan.outputs.artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/vp-restore
        id: cache
      - name: Check affected archives and Bun consumers
        run: bun scripts/ci/diagnostics.ts run artifacts bun scripts/ci/gate.ts artifacts
      - uses: ./.github/actions/vp-save
        with:
          key: ${{ steps.cache.outputs.key }}
      - uses: ./.github/actions/report-diagnostics
        if: always()
        with:
          job-status: ${{ job.status }}
          artifact-name: artifact-diagnostics
  postgres:
    needs: plan
    if: needs.plan.outputs.postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: drizzle
          POSTGRES_PASSWORD: drizzle
          POSTGRES_DB: drizzle_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U drizzle -d drizzle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Test Drizzle against isolated PostgreSQL
        run: bun scripts/ci/diagnostics.ts run postgres bun run --cwd packages/drizzle test:integration
        env:
          DRIZZLE_TEST_DATABASE_URL: postgresql://drizzle:drizzle@localhost:${{ job.services.postgres.ports['5432'] }}/drizzle_test
      - uses: ./.github/actions/report-diagnostics
        if: always()
        with:
          job-status: ${{ job.status }}
          artifact-name: postgres-diagnostics
  verify:
    if: always()
    needs: [plan, javascript, browser, artifacts, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Require every selected gate to pass
        env:
          GITHUB_NEEDS: ${{ toJSON(needs) }}
        run: bun scripts/ci/result.ts

  release:
    needs: verify
    # Allow intentionally skipped ancestors while still respecting cancellation.
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/canary' && needs.verify.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      verified-sha: ${{ github.sha }}
    secrets: inherit
