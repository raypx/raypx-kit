name: Restore VP task cache
description: Restore compatible tasks and snapshot successful artifact identities.
outputs:
  key:
    description: Unique cache save key
    value: ${{ steps.cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: node_modules/.vite/task-cache
        key: vp-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        restore-keys: |
          vp-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-
          vp-v1-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: node --import tsx scripts/ci/cache.ts snapshot
