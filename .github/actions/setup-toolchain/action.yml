name: Set up repository toolchain
description: Install the pinned Node and Bun runtimes and locked dependencies with shared Bun downloads.

inputs:
  registry-url:
    description: Optional npm registry used by the publishing job.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false
    - uses: oven-sh/setup-bun@v2
      id: bun
      with:
        bun-version-file: package.json
    - name: Configure Bun downloads
      shell: bash
      run: printf 'BUN_INSTALL_CACHE_DIR=%s\n' "$RUNNER_TEMP/raypx-kit-bun-cache" >> "$GITHUB_ENV"
    - name: Cache Bun downloads
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/raypx-kit-bun-cache
        key: bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-
    - name: Install locked dependencies
      shell: bash
      # CI needs no Git hooks; the root prepare script skips them with this flag.
      env:
        VP_GIT_HOOKS: "0"
      run: bun scripts/ci/diagnostics.ts run install bun install --frozen-lockfile
