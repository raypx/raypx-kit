name: Set up repository toolchain
description: Install pinned Node and pnpm with locked dependencies.
inputs:
  registry-url:
    description: Optional npm registry for publication
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install locked dependencies
      shell: bash
      env:
        VP_GIT_HOOKS: "0"
      run: node scripts/ci/diagnostics.ts run install pnpm install --frozen-lockfile
