# Workspace packages, catalogs, overrides and pnpm installation policy.
packages:
  - docs
  - packages/*
catalog:
  "@react-email/render": ^2.3.1
  react-email: ^6.11.11
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@^1.6.0
strictPeerDependencies: false
engineStrict: true
minimumReleaseAge: 0
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
  core-js: false
  protobufjs: false
